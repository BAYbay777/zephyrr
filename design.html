<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design - Zephyr (Soft Breeze)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMA UTAMA: ANGIN LEMBUT (SOFT BREEZE) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- BAR NAVIGASI --- */
        nav {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            color: #0284c7;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 16px;
            text-transform: lowercase;
            transition: color 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #0284c7;
        }

        /* --- PEMBUNGKUS EMBED CANVA --- */
        .canva-wrapper {
            max-width: 900px;
            width: 95%;
            margin: 30px auto 50px auto;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        .canva-container {
            position: relative;
            width: 100%;
            height: 0;
            /* Mengatur rasio agar pas dengan dokumen panjang Canva milikmu */
            padding-top: 140%; 
        }

        .canva-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ZEPHYR</div>
        <ul>
            <li><a href="index.html">home</a></li>
            <li><a href="design.html">design</a></li>
            <li><a href="product.html">product</a></li>
        </ul>
    </nav>

    <div class="canva-wrapper">
        <div class="canva-container">
            <iframe loading="lazy" src="https://www.canva.com/design/DAHHQJrjw0U/2mtxScgkRSpmjV5Y0ZqGBA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
    </div>

</body>
</html>
