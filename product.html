<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - Zephyr Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #38bdf8;
            --primary-hover: #0284c7;
            --spotify-green: #1DB954;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo { font-weight: 700; font-size: 20px; color: var(--primary-hover); }
        nav ul { list-style: none; display: flex; gap: 30px; }
        nav ul li a { text-decoration: none; color: var(--text-muted); font-weight: 500; }
        nav ul li a.active { color: var(--primary-hover); }

        .workspace { max-width: 1200px; width: 95%; margin: 40px auto; padding: 0 15px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }

        .card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            margin-bottom: 25px;
        }

        .card h3 { margin-bottom: 20px; color: #0f172a; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit;
        }

        .btn {
            width: 100%; padding: 12px; background: var(--primary-color); color: white;
            border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        
        .btn-spotify { 
            background-color: var(--spotify-green); 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
        }
        .btn-spotify:hover { background-color: #1ed760; }

        .timer-display { font-size: 64px; font-weight: 700; text-align: center; margin: 20px 0; color: #0f172a; }

        .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: white; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .todo-item input { width: 18px; height: 18px; cursor: pointer; }

        /* Modal PopUp Mood */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 16px; max-width: 450px; width: 90%; text-align: center; }
        .mood-options { display: flex; justify-content: space-around; margin: 25px 0; }
        .mood-btn { font-size: 32px; cursor: pointer; padding: 10px; border-radius: 12px; border: 2px solid transparent; }
        .mood-btn.selected { border-color: var(--primary-color); background: #f0fdf4; }
        .history-list { margin-top: 15px; max-height: 150px; overflow-y: auto; }
        .history-item { font-size: 14px; border-left: 3px solid var(--primary-color); padding: 5px 10px; margin-bottom: 8px; background: white; text-align: left;}
    </style>
</head>
<body>

    <nav>
        <div class="logo">ZEPHYR</div>
        <ul>
            <li><a href="index.html">home</a></li>
            <li><a href="design.html">design</a></li>
            <li><a href="product.html" class="active">product</a></li>
        </ul>
    </nav>

    <div class="workspace">
        <div class="grid-container">
            <div class="grid-col">
                <div class="card">
                    <h3>⏱️ Zephyr Focus Timer</h3>
                    <div class="form-group">
                        <label>Atur Waktu Sesi Belajar (Menit):</label>
                        <input type="number" id="timerInput" value="25" min="1">
                    </div>
                    <div id="timerDisplay" class="timer-display">25:00</div>
                    <div style="display: flex; gap: 10px; margin-top: 15px; width: 100%;">
                     <button id="timerBtn" class="btn" onclick="toggleTimer()" style="flex: 2; margin-top: 0;">Mulai Hitung Mundur</button>
                     <button id="resetTimerBtn" class="btn" onclick="resetTimer()" style="flex: 1; margin-top: 0; background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1;">Reset</button>
                    </div>
                </div>

                <div class="card">
                    <h3>🎵 Musik Penenang (Spotify)</h3>
                    <button id="spotifyAuthBtn" class="btn btn-spotify" onclick="loginSpotify()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.894-.982-.336.075-.668-.135-.744-.47-.075-.336.135-.668.47-.743 3.856-.88 7.15-.51 9.822 1.13.296.178.387.563.206.858zm1.224-2.723c-.226.367-.706.487-1.074.26-2.72-1.672-6.87-2.157-10.08-1.182-.413.125-.847-.107-.972-.52-.125-.413.107-.847.52-.972 3.676-1.114 8.24-.57 11.35 1.344.366.226.486.706.26 1.072zm.105-2.836C14.483 8.75 8.653 8.56 5.27 9.586c-.514.156-1.05-.133-1.206-.647-.156-.514.133-1.05.647-1.206 3.885-1.18 10.31-.96 14.383 1.46.46.273.61.87.337 1.33-.273.46-.87.61-1.33.337z"/></svg>
                        Hubungkan Playlist Spotify Kamu
                    </button>
                    
                    <div id="spotifyControlArea" style="display:none;">
                        <div class="form-group">
                            <label for="playlistSelect">Pilih Playlist Kamu:</label>
                            <select id="playlistSelect" onchange="loadSpotifyEmbed()">
                                <option value="">-- Memuat Playlist Kamu --</option>
                            </select>
                        </div>
                        <div id="spotifyEmbedContainer"></div>
                    </div>
                </div>
            </div>

            <div class="grid-col">
                <div class="card">
                    <h3>📝 Daftar Tugas Belajar</h3>
                    <div class="form-group" style="display:flex; gap:10px;">
                        <input type="text" id="todoInput" placeholder="Ketik agenda tugas baru...">
                        <button class="btn" style="width:auto; padding:0 25px;" onclick="addTodo()">Tambah</button>
                    </div>
                    <div id="todoContainer"></div>

                    <div id="moodHistorySection" style="margin-top: 35px; display: none;">
                        <h3>📊 Catatan Jurnal Evaluasi Mood</h3>
                        <div id="historyList" class="history-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="moodModal" class="modal">
        <div class="modal-content">
            <h2>Sesi Belajar Selesai! 🎉</h2>
            <div class="mood-options">
                <div class="mood-btn" onclick="selectMood('😫')" id="mood-😫">😫</div>
                <div class="mood-btn" onclick="selectMood('😐')" id="mood-😐">😐</div>
                <div class="mood-btn" onclick="selectMood('😌')" id="mood-😌">😌</div>
                <div class="mood-btn" onclick="selectMood('🚀')" id="mood-🚀">🚀</div>
            </div>
            <div class="form-group"><input type="text" id="moodNote" placeholder="Catatan evaluasi belajar (opsional)"></div>
            <button class="btn" onclick="saveMoodReport()">Simpan Jurnal Laporan</button>
        </div>
    </div>

    <script>
        // --- KONFIGURASI API SPOTIFY ---
        const CLIENT_ID = '11177b9471b146278eff8c91259922dc'; 
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const SCOPES = 'playlist-read-private playlist-read-collaborative';

        let timerInterval = null;
        let timerSecondsLeft = 0;
        let isTimerRunning = false;
        let selectedMoodIcon = '';
        let spotifyToken = null;

        let todoStorage = JSON.parse(localStorage.getItem('zephyr_todos')) || [];
        let moodStorage = JSON.parse(localStorage.getItem('zephyr_moods')) || [];

        // Memeriksa token akses Spotify dari URL Hash callback
        function checkSpotifyToken() {
            const hash = window.location.hash.substring(1).split('&').reduce((initial, item) => {
                if (item) { var parts = item.split('='); initial[parts[0]] = decodeURIComponent(parts[1]); }
                return initial;
            }, {});
            
            // Bersihkan hash di URL browser agar bersih
            if (window.location.hash) {
                history.pushState("", document.title, window.location.pathname + window.location.search);
            }

            // Gunakan token baru atau token yang sebelumnya sudah tersimpan di sessionStorage
            if (hash.access_token) {
                spotifyToken = hash.access_token;
                sessionStorage.setItem('spotify_token', spotifyToken);
            } else {
                spotifyToken = sessionStorage.getItem('spotify_token');
            }

            if (spotifyToken) {
                document.getElementById('spotifyAuthBtn').style.display = 'none';
                document.getElementById('spotifyControlArea').style.display = 'block';
                fetchUserPlaylists();
            }
        }

        window.onload = () => { checkSpotifyToken(); renderTodos(); renderMoods(); };

        function loginSpotify() {
            window.location = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}&response_type=token&show_dialog=true`;
        }

        // Mengambil daftar playlist asli milik pengguna langsung dari API Spotify
        function fetchUserPlaylists() {
            fetch('https://api.spotify.com/v1/me/playlists', {
                headers: { 'Authorization': 'Bearer ' + spotifyToken }
            })
            .then(res => {
                if (res.status === 401) { // Token kedaluwarsa
                    sessionStorage.removeItem('spotify_token');
                    document.getElementById('spotifyAuthBtn').style.display = 'block';
                    document.getElementById('spotifyControlArea').style.none;
                    throw new Error("Token expired");
                }
                return res.json();
            })
            .then(data => {
                const select = document.getElementById('playlistSelect');
                select.innerHTML = '<option value="">-- Pilih Playlist Kamu --</option>';
                if (data.items) {
                    data.items.forEach(pl => {
                        select.innerHTML += `<option value="${pl.id}">${pl.name}</option>`;
                    });
                }
                
                // Kembalikan pilihan playlist terakhir jika ada di cache memory
                const lastPlaylist = localStorage.getItem('zephyr_last_playlist');
                if (lastPlaylist) {
                    select.value = lastPlaylist;
                    loadSpotifyEmbed();
                }
            }).catch(err => console.log("Kendala memuat playlist Spotify:", err));
        }

        // Memuat Tampilan Iframe Player Berdasarkan Playlist Pilihan Pengguna
        function loadSpotifyEmbed() {
            const playlistId = document.getElementById('playlistSelect').value;
            const container = document.getElementById('spotifyEmbedContainer');
            
            if (!playlistId) {
                container.innerHTML = '';
                return;
            }

            localStorage.setItem('zephyr_last_playlist', playlistId);
            
            // Memasang widget resmi pemutar Spotify sesuai dengan ID Playlist pilihan user
            container.innerHTML = `
                <iframe id="spotifyIframe" style="border-radius:12px" 
                    src="https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator" 
                    width="100%" height="360" frameBorder="0" allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
                </iframe>`;
        }

        // ================= JAVASCRIPT TIMER CONTROLLER =================
        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('timerBtn').innerText = 'Lanjutkan Sesi';
            } else {
                if (timerSecondsLeft <= 0) {
                    const mins = parseInt(document.getElementById('timerInput').value) || 25;
                    timerSecondsLeft = mins * 60;
                }
                isTimerRunning = true;
                document.getElementById('timerBtn').innerText = 'Jeda Sesi (Pause)';
                
                timerInterval = setInterval(() => {
                    timerSecondsLeft--;
                    updateTimerDisplay();
                    if (timerSecondsLeft <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        document.getElementById('timerBtn').innerText = 'Mulai Sesi Baru';
                        openMoodModal();
                    }
                }, 1000);
            }
        }
      function resetTimer() {
    // 1. Hentikan hitungan mundur secara total menggunakan variabel asli kamu
    clearInterval(timerInterval);
    isTimerRunning = false;
    
    // 2. Ambil nilai menit terbaru dari kotak input 'timerInput'
    const inputMinutes = document.getElementById('timerInput') ? parseInt(document.getElementById('timerInput').value) : 25;
    
    // 3. Kembalikan isi sisa detik waktu berjalan ke hitungan menit awal
    timerSecondsLeft = inputMinutes * 60;
    
    // 4. Perbarui visual teks jam di layar ke posisi awal (misal 25:00)
    const display = document.getElementById('timerDisplay');
    if (display) {
        display.innerText = String(inputMinutes).padStart(2, '0') + ":00";
    }
    
    // 5. Kembalikan teks tombol utama menjadi sedia kala
    const startBtn = document.getElementById('timerBtn');
    if (startBtn) {
        startBtn.innerText = "Mulai Hitung Mundur";
        startBtn.style.backgroundColor = ""; // Mengembalikan warna ke setelan CSS awal (.btn)
    }
}
        function updateTimerDisplay() {
            const m = Math.floor(timerSecondsLeft / 60); const s = timerSecondsLeft % 60;
            document.getElementById('timerDisplay').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // ================= TO-DO & MOOD CONTROLLER =================
        function addTodo() {
            const input = document.getElementById('todoInput'); if (!input.value.trim()) return;
            todoStorage.push(input.value.trim());
            localStorage.setItem('zephyr_todos', JSON.stringify(todoStorage));
            input.value = ''; renderTodos();
        }
        function removeTodo(index) {
            setTimeout(() => { todoStorage.splice(index, 1); localStorage.setItem('zephyr_todos', JSON.stringify(todoStorage)); renderTodos(); }, 200);
        }
        function renderTodos() {
            const container = document.getElementById('todoContainer'); container.innerHTML = '';
            if (todoStorage.length === 0) { container.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">Belum ada daftar tugas.</p>'; return; }
            todoStorage.forEach((task, index) => {
                const item = document.createElement('div'); item.className = 'todo-item';
                item.innerHTML = `<input type="checkbox" onclick="removeTodo(${index})"><span>${task}</span>`;
                container.appendChild(item);
            });
        }
        function openMoodModal() { selectedMoodIcon = ''; document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected')); document.getElementById('moodModal').style.display = 'flex'; }
        function selectMood(mood) { selectedMoodIcon = mood; document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected')); document.getElementById(`mood-${mood}`).classList.add('selected'); }
        function saveMoodReport() {
            if (!selectedMoodIcon) { alert('Pilih emoji dulu!'); return; }
            moodStorage.push({ time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), mood: selectedMoodIcon, note: document.getElementById('moodNote').value.trim() });
            localStorage.setItem('zephyr_moods', JSON.stringify(moodStorage));
            document.getElementById('moodModal').style.display = 'none'; renderMoods();
        }
        function renderMoods() {
            const listContainer = document.getElementById('historyList'); const section = document.getElementById('moodHistorySection'); listContainer.innerHTML = '';
            if (moodStorage.length > 0) { section.style.display = 'block'; [...moodStorage].reverse().forEach(log => { listContainer.innerHTML += `<div class="history-item">🕒 Sesi ${log.time} - <b>Kondisi: ${log.mood}</b><br><span style="color:var(--text-muted); font-size:13px;">${log.note ? `💬 "${log.note}"` : ''}</span></div>`; }); } else { section.style.display = 'none'; }
        }
    </script>
</body>
</html>
