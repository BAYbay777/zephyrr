<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk atau Daftar - Zephyr</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --primary-color: #38bdf8;
            --primary-hover: #0284c7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Tombol Kembali ke Home di Pojok Kiri Atas */
        .back-to-home {
            position: absolute;
            top: 30px;
            left: 40px;
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
            z-index: 10;
        }
        .back-to-home:hover {
            color: var(--primary-hover);
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            height: 600px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol bypass darurat di bawah kotak */
        .bypass-container {
            position: absolute;
            bottom: 40px;
            text-align: center;
            z-index: 2;
        }

        .bypass-link {
            font-size: 14px;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .bypass-link:hover {
            color: var(--primary-hover);
        }

        /* Dekorasi Teks Latar Belakang */
        .bg-deco {
            position: absolute;
            font-size: 16vw;
            font-weight: 800;
            color: rgba(56, 189, 248, 0.03);
            bottom: -5%;
            right: 5%;
            user-select: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-to-home">← Kembali</a>

    <div class="auth-wrapper">
        <iframe 
            src="https://zephyrr-jh7k28f4xsgg9i9juh8jff.streamlit.app/?embed=true">
        </iframe>
    </div>

    <div class="bypass-container">
        <a href="product.html" class="bypass-link">Langsung masuk ke Workspace tanpa akun →</a>
    </div>
    
    <div class="bg-deco">ZEPHYR</div>

</body>
</html>
